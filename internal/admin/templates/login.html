<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · {{.AppName}} Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="h-full bg-slate-950 font-sans text-slate-100 antialiased relative overflow-x-hidden flex items-center justify-center p-4 selection:bg-brand-500 selection:text-white">
  <!-- Radiant Ambient Background Blobs -->
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-brand-600/20 rounded-full blur-[120px]"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-cyan-600/15 rounded-full blur-[130px]"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-indigo-600/15 rounded-full blur-[120px]"></div>
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b12_1px,transparent_1px),linear-gradient(to_bottom,#1e293b12_1px,transparent_1px)] bg-[size:32px_32px]"></div>
  </div>

  <div class="w-full max-w-md">
    <!-- Card Container -->
    <div class="relative bg-slate-900/80 backdrop-blur-2xl rounded-3xl border border-slate-800 shadow-2xl p-8 sm:p-10 transition-all duration-300 hover:border-slate-700/80">
      <!-- Glow border accent -->
      <div class="absolute -top-px left-12 right-12 h-px bg-gradient-to-r from-transparent via-brand-500/50 to-transparent"></div>

      <!-- Header Section -->
      <div class="flex flex-col items-center text-center mb-8">
        <div class="relative mb-5">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-teal-400 p-[1px] shadow-lg shadow-brand-500/20">
            <div class="w-full h-full bg-slate-900/90 rounded-[15px] flex items-center justify-center">
              <i data-lucide="layers" class="w-8 h-8 text-brand-400"></i>
            </div>
          </div>
          <span class="absolute -bottom-2 -right-2 px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-brand-500/20 text-brand-300 border border-brand-500/30">CMS</span>
        </div>

        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">{{.AppName}}</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-2 max-w-xs leading-relaxed">
          Portal manajemen konten landing page & administrasi terpadu
        </p>
      </div>

      <!-- Error Notification -->
      {{if .Error}}
      <div class="mb-6 rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-300 flex items-start gap-3 animate-in fade-in duration-200">
        <i data-lucide="alert-circle" class="w-5 h-5 text-rose-400 flex-shrink-0 mt-0.5"></i>
        <div class="flex-1 font-medium">{{.Error}}</div>
      </div>
      {{end}}

      <!-- Login Form -->
      <form method="POST" action="/admin/login" class="space-y-5">
        <input type="hidden" name="_csrf" value="{{.CSRF}}">

        <!-- Email Field -->
        <div class="space-y-1.5">
          <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
            Email Address <span class="text-brand-400">*</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="mail" class="w-4 h-4"></i>
            </div>
            <input 
              id="email" 
              name="email" 
              type="email" 
              required 
              autofocus 
              autocomplete="username" 
              value="{{.Email}}"
              placeholder="admin@example.com"
              class="w-full rounded-xl bg-slate-950/60 border border-slate-800 pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
              Password <span class="text-brand-400">*</span>
            </label>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input 
              id="password" 
              name="password" 
              type="password" 
              required 
              autocomplete="current-password"
              placeholder="••••••••"
              class="w-full rounded-xl bg-slate-950/60 border border-slate-800 pl-10 pr-11 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all"
            >
            <button 
              type="button" 
              id="togglePassword" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition-colors focus:outline-none"
              tabindex="-1"
            >
              <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Remember / Hint Row -->
        <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" name="remember" class="w-4 h-4 rounded border-slate-800 bg-slate-950 text-brand-600 focus:ring-brand-500 focus:ring-offset-slate-900 rounded cursor-pointer">
            <span>Ingat sesi ini</span>
          </label>
          <span class="text-slate-500">Akses Terenkripsi</span>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            class="group w-full rounded-xl bg-gradient-to-r from-brand-600 to-teal-600 hover:from-brand-500 hover:to-teal-500 text-white font-bold py-3.5 px-4 text-sm shadow-lg shadow-brand-600/25 hover:shadow-brand-600/40 active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer"
          >
            <span>Masuk ke Dashboard</span>
            <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
          </button>
        </div>
      </form>

      <!-- Security / Footer Note -->
      <div class="mt-8 pt-6 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
          <span>Sistem Aktif</span>
        </span>
        <span>FourPlusOne Enterprise &copy; 2026</span>
      </div>
    </div>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Toggle password visibility
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
        lucide.createIcons();
      });
    }
  </script>
</body>
</html>
