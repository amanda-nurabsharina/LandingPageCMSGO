<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · {{.AppName}} Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: { 50:'#ecfdf5', 100:'#d1fae5', 500:'#10b981', 600:'#059669', 700:'#047857' } } } } }
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
<div class="min-h-screen flex">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-64 -translate-x-full lg:translate-x-0 transition-transform bg-white border-r border-slate-200 flex flex-col">
    <div class="h-16 flex items-center px-6 border-b border-slate-100">
      <a href="/admin" class="text-lg font-bold text-primary-600">{{.AppName}}</a>
    </div>
    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-3">
      <a href="/admin" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-semibold {{if eq .Active "dashboard"}}bg-primary-50 text-primary-600{{else}}text-slate-700 hover:bg-slate-50{{end}}">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>Dashboard</span>
      </a>
      {{range .GroupedNav}}
      <div>
        <div class="px-3 pt-2 pb-1 text-[11px] font-bold uppercase tracking-wider text-slate-400">{{.Group}}</div>
        <div class="space-y-0.5">
          {{range .Items}}
          <a href="/admin/{{.Slug}}" class="flex items-center gap-3 rounded-lg px-3 py-1.5 text-sm {{if eq .Slug $.Active}}bg-primary-50 text-primary-600 font-semibold{{else}}text-slate-700 hover:bg-slate-50{{end}}">
            <i data-lucide="{{.Icon}}" class="w-4 h-4"></i><span>{{.Label}}</span>
          </a>
          {{end}}
        </div>
      </div>
      {{end}}
    </nav>
    <form action="/admin/logout" method="POST" class="px-6 py-4 border-t border-slate-100">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <button type="submit" class="group flex w-full items-center gap-x-3 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 hover:text-red-600 transition-colors">
        <i data-lucide="log-out" class="h-5 w-5 text-slate-400 group-hover:text-red-500"></i>
        <span>Logout</span>
      </button>
    </form>
  </aside>

  <div class="flex-1 lg:pl-64 min-w-0">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-8 sticky top-0 z-20">
      <button type="button" class="lg:hidden p-2 rounded-lg hover:bg-slate-100" onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="font-semibold text-slate-600 hidden sm:block">{{.Title}}</div>
      {{with .User}}
      <div class="flex items-center gap-3">
        <div class="text-right">
          <div class="text-sm font-semibold">{{.Name}}</div>
          <div class="text-xs text-slate-500">{{.Email}}</div>
        </div>
        <div class="w-9 h-9 rounded-full bg-primary-600 text-white flex items-center justify-center font-bold">{{initial .Name}}</div>
      </div>
      {{end}}
    </header>

    <main class="p-4 sm:p-8 max-w-7xl">
      {{if .Flash}}
      <div class="mb-6 rounded-lg border border-primary-100 bg-primary-50 px-4 py-3 text-sm font-medium text-primary-700 flex items-center gap-2">
        <i data-lucide="circle-check" class="w-5 h-5"></i>{{.Flash}}
      </div>
      {{end}}
      {{if .FormError}}
      <div class="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700">{{.FormError}}</div>
      {{end}}
      {{template "content" .}}
    </main>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
